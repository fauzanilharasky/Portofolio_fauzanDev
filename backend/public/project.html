<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Details</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .project-detail-hero {
            padding: 120px 10% 50px;
            background: #0f172a;
            color: #f8fafc;
            text-align: center;
        }
        .project-detail-hero h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            color: #eab308;
        }
        .project-detail-hero .meta {
            display: flex;
            justify-content: center;
            gap: 20px;
            color: #94a3b8;
            margin-bottom: 30px;
        }
        .meta-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .project-detail-image {
            max-width: 900px;
            margin: 0 auto 50px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        .project-detail-image img {
            width: 100%;
            display: block;
        }
        .project-detail-content {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 20px 100px;
            color: #cbd5e1;
            line-height: 1.8;
            font-size: 1.1rem;
        }
        .project-detail-content h2, 
        .project-detail-content h3 {
            color: #f8fafc;
            margin-top: 40px;
            margin-bottom: 20px;
        }
        .links-bar {
            display: flex;
            gap: 20px;
            margin-top: 50px;
            justify-content: center;
        }
        .link-btn {
            padding: 12px 25px;
            background: #1e293b;
            color: #fff;
            border-radius: 30px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .link-btn:hover {
            background: #eab308;
            color: #0f172a;
        }
        .back-btn {
            position: absolute;
            top: 40px;
            left: 5%;
            color: #94a3b8;
            font-size: 1.2rem;
            text-decoration: none;
            transition: color 0.3s;
        }
        .back-btn:hover {
            color: #eab308;
        }
    </style>
</head>
<body>

    <a href="/" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Portfolio</a>

    <div id="project-container">
        <!-- Content will be injected here via JS -->
        <h2 style="text-align:center; padding: 100px; color:#fff;">Loading project details...</h2>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const projectId = urlParams.get('id');

            if (!projectId) {
                document.getElementById('project-container').innerHTML = '<h2 style="text-align:center; padding: 100px; color:#ef4444;">Project Not Found</h2>';
                return;
            }

            try {
                const response = await fetch(`/api/projects/${projectId}`);
                if (!response.ok) throw new Error('Failed to fetch project');
                
                const project = await response.json();
                
                // Format dates safely
                const startDate = project.start_date ? new Date(project.start_date).toLocaleDateString() : '';
                const endDate = project.end_date ? new Date(project.end_date).toLocaleDateString() : 'Present';
                const dateString = startDate ? `${startDate} - ${endDate}` : '';

                let linksHtml = '';
                if(project.demo_url) linksHtml += `<a href="${project.demo_url}" target="_blank" class="link-btn"><i class="fas fa-external-link-alt"></i> Live Demo</a>`;
                if(project.github_url) linksHtml += `<a href="${project.github_url}" target="_blank" class="link-btn"><i class="fab fa-github"></i> Source Code</a>`;
                if(project.documentation_url) linksHtml += `<a href="${project.documentation_url}" target="_blank" class="link-btn"><i class="fas fa-book"></i> Documentation</a>`;

                document.getElementById('project-container').innerHTML = `
                    <div class="project-detail-hero">
                        <h1>${project.title}</h1>
                        <div class="meta">
                            ${project.category ? `<div class="meta-item"><i class="fas fa-tag"></i> ${project.category}</div>` : ''}
                            ${project.role ? `<div class="meta-item"><i class="fas fa-user"></i> ${project.role}</div>` : ''}
                            ${dateString ? `<div class="meta-item"><i class="fas fa-calendar"></i> ${dateString}</div>` : ''}
                            ${project.status ? `<div class="meta-item"><i class="fas fa-check-circle"></i> ${project.status}</div>` : ''}
                        </div>
                    </div>

                    ${project.cover_image ? `
                        <div class="project-detail-image">
                            <img src="${project.cover_image}" alt="${project.title}">
                        </div>
                    ` : ''}

                    <div class="project-detail-content">
                        ${project.full_description ? project.full_description.replace(/\n/g, '<br>') : (project.short_description || 'No description available.')}
                        
                        ${linksHtml ? `<div class="links-bar">${linksHtml}</div>` : ''}
                    </div>
                `;
            } catch (err) {
                document.getElementById('project-container').innerHTML = '<h2 style="text-align:center; padding: 100px; color:#ef4444;">Error loading project details.</h2>';
                console.error(err);
            }
        });
    </script>
</body>
</html>
